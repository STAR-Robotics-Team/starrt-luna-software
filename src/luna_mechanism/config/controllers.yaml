/mechanism_sim/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    position_controller:
      type: position_controllers/JointGroupPositionController
    velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
/mechanism_sim/position_controller:
  ros__parameters:
    joints: [depth_left_joint, depth_right_joint, hatch_joint]
/mechanism_sim/velocity_controller:
  ros__parameters:
    joints: [excavator_chain_joint, conveyor_joint]
/mechanism_sim/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
