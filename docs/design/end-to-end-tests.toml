# Registry for the end-to-end test procedures (end-to-end-tests.md), which scripts/design
# renders. Each procedure follows one thing the robot does through every node it crosses.
# Each step names the node, and the interface and budget it relies on, so the check
# catches a step that names something no registry defines. See "Registries" in README.md,
# then run scripts/design render.
#
# Runs are recorded in the test-run sheet, one tab per procedure, not here: the website
# reads the sheet when it builds. sheet_gid names each procedure's tab, and
# scripts/design sheet prints the first column each tab needs.

[[sheet]]
edit_url = "https://docs.google.com/spreadsheets/d/1qYh5hzQPgHA6WQpqN9SrjHDDrfeMzqhxvYa_3uOBYCk/edit"
published = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEq7UiHTIVmG_7BxFXVImzK7gJyREeR-F4SsWEld4z7hvEtR7XihwR2nUI1nQNEwGXuo1uRkYja8dO/pub"

[[procedure]]
id = "stick-drives-wheels"
sheet_gid = 273900859
title = "The stick moves the wheels"
purpose = "Follows a TELEOP drive command from the gamepad to the drive motors: through the operator frontend, rosbridge, teleop_node, command selection, and the drivetrain."
measures = ["TPM-6"]

[[procedure.step]]
actor = "Operator"
node = "operator_frontend"
does = "Enables the robot in TELEOP and TRAVEL from the laptop controls"
interface = "/robot/request_mode"

[[procedure.step]]
node = "mode_manager"
does = "Accepts the request and publishes ENABLED, TELEOP, TRAVEL"
interface = "/robot/mode"

[[procedure.step]]
actor = "Operator"
does = "Holds LB and pushes the left stick forward (the teleop draft's mapping)"

[[procedure.step]]
node = "operator_frontend"
does = "Reads the stick through the Gamepad API and sends it over rosbridge"
interface = "/joy"
budget = "TPM-6"

[[procedure.step]]
node = "teleop_node"
does = "Turns the fresh input into a drive command, since LB is held"
interface = "/teleop/cmd_vel"

[[procedure.step]]
node = "command_selection"
does = "Passes TELEOP's command on, since /robot/mode names TELEOP"
interface = "/cmd_vel"

[[procedure.step]]
node = "drivetrain"
does = "Sends each side's speed to its motor controllers over CAN, within TRAVEL's current limit"

[[procedure.step]]
actor = "Operator"
does = "Releases LB"

[[procedure.step]]
node = "teleop_node"
does = "Zeroes the drive command"
interface = "/teleop/cmd_vel"

[[procedure.pass]]
text = "The wheels turn forward while LB is held and the stick is pushed, and stop when LB is released (teleop draft R2)."

[[procedure.pass]]
text = "With the TELEOP default view, camera on, the link averages under 1,000 kbit/s."
tpm = "TPM-6"

[[procedure.pass]]
text = "[TBD: a pass line for button-to-motor latency, from the teleop draft's tc netem test, teleoperation doc (5.1)]"

[[procedure]]
id = "link-loss"
sheet_gid = 1450027895
title = "The operator link drops"
purpose = "Follows the loss of the operator's heartbeat to zero output at every motor, in TELEOP and in AUTO (operating modes R3)."
measures = ["TPM-8"]

[[procedure.step]]
node = "mode_manager"
does = "Has the robot ENABLED and driving, wheels off the ground"
interface = "/robot/mode"

[[procedure.step]]
actor = "Tester"
does = "Pulls the access point's Wi-Fi; in a separate run, closes the operator frontend while the Wi-Fi stays up and the robot still answers pings"

[[procedure.step]]
node = "operator_frontend"
does = "Stops sending the heartbeat"
interface = "/operator/heartbeat"
budget = "TPM-8"

[[procedure.step]]
node = "mode_manager"
does = "Hears no heartbeat for link_timeout and publishes DISABLED, with the reason \"link lost\""
interface = "/robot/mode"
budget = "TPM-8"

[[procedure.step]]
node = "drivetrain"
does = "Sends zero output in its next control loop"
interface = "/robot/mode"
budget = "TPM-7"

[[procedure.step]]
node = "mechanism"
does = "Sends zero output in its next control loop"
interface = "/robot/mode"
budget = "TPM-7"

[[procedure.step]]
actor = "Tester"
does = "Restores the link"

[[procedure.pass]]
text = "Every output is zero within 600 ms of the last heartbeat, 3 of 3, timed from the recording."
tpm = "TPM-8"

[[procedure.pass]]
text = "When the link comes back, nothing moves until the operator enables the robot again, and a burst of late heartbeats does not enable it (teleop draft R4)."

[[procedure.pass]]
text = "[TBD: no false disables in a 10-minute tc netem run, at a packet loss rate the radio link evaluation (5.7) sets]"

[[procedure]]
id = "battery-low"
sheet_gid = 1527623844
title = "The battery runs low"
purpose = "Follows a sagging battery voltage to halved current limits, with the robot still running (operating modes R7 and section 7)."

[[procedure.step]]
actor = "PDP"
does = "Sends the battery voltage in its status frames. In Sim, the fake power panel sends scripted frames instead."

[[procedure.step]]
node = "power_panel"
does = "Decodes the frames and publishes the voltage"
interface = "/power/battery"

[[procedure.step]]
node = "mode_manager"
does = "Warns the operator below cell_warn_v (14.0 V for 4 cells), and halves every current limit after low_voltage_hold (2.0 s) below cell_critical_v (13.2 V)"
interface = "/power/battery"

[[procedure.step]]
node = "drivetrain"
does = "Halves its current limits [TBD: how it learns to, drivetrain doc (3.1)]"

[[procedure.step]]
node = "mechanism"
does = "Halves its current limits [TBD: how it learns to, mechanism doc (4.2)]"

[[procedure.step]]
node = "operator_frontend"
does = "Shows the battery voltage and the warning"
interface = "/power/battery"

[[procedure.pass]]
text = "The operator is warned at 14.0 V, every current limit halves after 2.0 s below 13.2 V, a dip shorter than 2 s changes nothing, and the robot stays ENABLED."

[[procedure]]
id = "e-stop"
sheet_gid = 10490958
title = "The E-stop is pressed"
purpose = "Follows an E-stop press with no software in its path, and shows that moving again takes two operator actions (operating modes R4 to R6)."

[[procedure.step]]
actor = "Tester"
does = "Presses the E-stop while the robot is ENABLED and driving"

[[procedure.step]]
actor = "E-stop"
does = "Cuts the main battery from every controller. The energy loggers and the robot computer, on its own battery, stay powered."

[[procedure.step]]
node = "mode_manager"
does = "Sees every motor controller's status go missing, and enters FAULT with the reason \"main power lost\""
interface = "/robot/mode"

[[procedure.step]]
node = "operator_frontend"
does = "Shows FAULT and its reason"
interface = "/robot/mode"

[[procedure.step]]
actor = "Tester"
does = "Resets the E-stop"

[[procedure.step]]
actor = "Operator"
node = "operator_frontend"
does = "Clears the fault, then separately requests ENABLED"
interface = "/robot/request_mode"

[[procedure.pass]]
text = "Nothing moves from the press until the operator has cleared the fault and enabled again."

[[procedure.pass]]
text = "With the E-stop pressed, every rail reads zero except the energy loggers and the robot computer's battery."

[[procedure.pass]]
text = "The energy logger's reading is the same before the press and after the reset."

[[procedure]]
id = "auto-cycle"
sheet_gid = 1483942929
title = "One AUTO cycle"
purpose = "Follows a full autonomous cycle, dig, travel loaded, dump, and travel back, with no operator input after AUTO is enabled."
measures = ["TPM-1", "TPM-2", "TPM-3", "TPM-4", "TPM-6", "TPM-10", "TPM-11"]

[[procedure.step]]
actor = "Operator"
node = "operator_frontend"
does = "Tells the judge, then enables the robot in AUTO from the laptop controls"
interface = "/robot/request_mode"
budget = "TPM-3"

[[procedure.step]]
node = "mode_manager"
does = "Publishes ENABLED, AUTO"
interface = "/robot/mode"

[[procedure.step]]
node = "task_sequencer"
does = "Requests EXCAVATE"
interface = "/robot/request_task"
budget = "TPM-2"

[[procedure.step]]
node = "task_sequencer"
does = "Sends the mechanism commands that dig until the bin is full"
interface = "auto-mechanism-command"
budget = "TPM-2"

[[procedure.step]]
node = "command_selection"
does = "Passes AUTO's commands on, and drops teleop's"
interface = "mechanism-command"

[[procedure.step]]
node = "mechanism"
does = "Digs within EXCAVATE's limits and reports when the excavator is stowed"
interface = "/mechanism/status"
budget = "TPM-9"

[[procedure.step]]
node = "task_sequencer"
does = "Requests TRAVEL once the excavator is stowed"
interface = "/robot/request_task"

[[procedure.step]]
node = "localization"
does = "Keeps the robot's position and the obstacle map current"
interface = "obstacle-map"
budget = "TPM-5"

[[procedure.step]]
node = "planner"
does = "Plans a path to the construction zone around the mapped obstacles, and follows it"
interface = "auto-drive-command"
budget = "TPM-4"

[[procedure.step]]
node = "drivetrain"
does = "Drives within TRAVEL's limits"
interface = "/cmd_vel"

[[procedure.step]]
node = "task_sequencer"
does = "Requests DUMP, then opens the hatch and runs the conveyor"
interface = "auto-mechanism-command"
budget = "TPM-2"

[[procedure.step]]
node = "task_sequencer"
does = "Requests TRAVEL, and the robot drives back to dig again"
interface = "/robot/request_task"

[[procedure.step]]
node = "operator_frontend"
does = "Shows the AUTO default view throughout: the obstacle map and the planned path"
interface = "planned-path"
budget = "TPM-6"

[[procedure.pass]]
text = "The cycle completes with no operator input after AUTO is enabled."
tpm = "TPM-1"

[[procedure.pass]]
text = "The cycle takes at most 7.0 min, with a goal of 6.0 min."
tpm = "TPM-2"

[[procedure.pass]]
text = "The cycle starts within 300 s of the run's start, with a goal of 60 s."
tpm = "TPM-3"

[[procedure.pass]]
text = "The robot touches no obstacle."
tpm = "TPM-4"

[[procedure.pass]]
text = "The link averages under 1,000 kbit/s with the AUTO default view."
tpm = "TPM-6"

[[procedure.pass]]
text = "The energy the cycle uses is recorded, as the baseline for later runs."
tpm = "TPM-10"

[[procedure.pass]]
text = "The robot computer's processor load averages under 70%."
tpm = "TPM-11"
