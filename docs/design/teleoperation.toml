# Registry for the teleoperation design (teleoperation.md, deliverable 5.1). See
# "Registries" in README.md, then run scripts/design render.
#
# The operator frontend runs in a browser and is not a ROS node: rosbridge publishes and
# calls for it, and the platform doc's registry holds rosbridge itself.

[[node]]
id = "operator_frontend"
name = "Operator frontend"
package = "Custom frontend with `roslibjs`"
runs_on = "Operator laptop, in a browser, through rosbridge"
element = "SW.3.1"
does = "Reads the gamepad through the browser's Gamepad API, sends /joy, the heartbeat, and mode requests through rosbridge, and shows each control source's default view, which the operator can change, with live link bandwidth. It is not a ROS node: rosbridge publishes and calls for it."
calls = ["/robot/request_mode"]
subscribes = ["/robot/mode", "/power/battery", "/mechanism/status", "camera-image", "obstacle-map", "planned-path", "autonomy-status"]

[[node.publishes]]
name = "/joy"
type = "sensor_msgs/msg/Joy"
rate = "`autorepeat_rate`, 20 Hz, and on change [TBR]"
qos = "[TBD: as rosbridge publishes it, 5.4]"
note = "Stamped by the frontend in the robot's time (open question 6), so teleop_node can pass the stamp on to its commands."

[[node.publishes]]
name = "/operator/heartbeat"
type = "std_msgs/msg/Header"
rate = "`heartbeat_rate`, 10 Hz, including in AUTO and with the hold button released"
qos = "best effort, depth 1"
note = "mode_manager judges a heartbeat's age by when it arrived, so the heartbeat needs no clock agreement between the laptop and the robot."

[[node]]
id = "teleop_node"
name = "`teleop_node`"
package = "`luna_teleop`"
runs_on = "Robot computer"
element = "SW.3.2"
does = "Turns fresh /joy input into drive and mechanism commands, each stamped with its /joy message's stamp, zeroes them when the hold button is released, drops stale input, and requests DISABLED when the controller's input is lost"
subscribes = ["/joy", "/robot/mode"]
calls = ["/robot/request_mode"]

[[node.publishes]]
name = "/teleop/cmd_vel"
type = "geometry_msgs/msg/TwistStamped"
rate = "`command_rate`, 20 Hz [TBR]"
qos = "best effort, volatile, depth 1"
note = "command_selector forwards it as /cmd_vel while the control source is TELEOP (system design, Command selection)."

[[node.publishes]]
id = "teleop-mechanism-command"
name = "/teleop/mechanism/<function>/command"
type = "luna_interfaces/msg/ActuatorCommand [TBR: proposed in the mechanism doc (4.2)]"
rate = "`command_rate`, 20 Hz [TBR]"
qos = "best effort, volatile, depth 1"
note = "One topic for each mechanism function: depth, excavator, conveyor, and hatch, each an output command (mechanism design, section 3)."

# ----------------------------------------------------------------------------------------
# Open questions, as the teleop draft numbered them (questions 1 and 2 were settled in
# review). Who answers each one, and by when, is in Turgor.
# ----------------------------------------------------------------------------------------

[[question]]
number = 3
status = "decided"
decided = 2026-11-14
text = "Movement commands are TwistStamped on /teleop/cmd_vel and /auto/cmd_vel, and ActuatorCommand on one topic per mechanism function. command_selector forwards only the source /robot/mode names, and never falls back to the other ([system design, Command selection](system.md#command-selection))."

[[question]]
number = 4
status = "open"
turgor = ["5.7"]
text = "What final network settings and frontend delivery will be used: HTTPS and secure WebSockets served from the robot computer, or a packaged desktop app?"

[[question]]
number = 5
status = "decided"
decided = 2026-11-14
text = "One command topic for each function that moves on its own: drive, depth, excavator, conveyor, and hatch ([mechanism design, section 3](mechanism.md#3-interfaces)). Telemetry comes one topic per source, such as /mechanism/status and /power/battery, not one per motor or button."

[[question]]
number = 6
status = "open"
turgor = ["5.4"]
text = "How does the robot judge the age of a command whose stamp starts on the laptop? The frontend stamps /joy, so a stale command after a Wi-Fi stall is caught only if the laptop's clock agrees with the robot's. Proposed: the frontend measures the offset with rosapi's get_time service, part of the rosbridge suite, from round trips, and stamps /joy in the robot's time; an operator laptop's own clock cannot be relied on to be set."
