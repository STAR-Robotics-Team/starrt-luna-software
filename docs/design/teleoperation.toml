# Registry for the teleoperation design (teleoperation.md, deliverable 5.1, in PR #14).
# These rows follow the teleop draft as of its 2026-11-06 commit (3bba230): a browser
# frontend on rosbridge, with teleop_node on the robot computer. They are the contract the
# other docs build against until the teleoperation doc lands and confirms or changes them.
# See "Registries" in README.md, then run scripts/design render.

[[node]]
id = "operator_frontend"
name = "Operator frontend"
package = "Custom frontend with `roslibjs` [TBR: teleop draft, PR #14]"
runs_on = "Operator laptop, in a browser, through rosbridge"
element = "SW.3.1"
does = "Reads the gamepad through the browser's Gamepad API, sends /joy, the heartbeat, and mode requests through rosbridge, and shows each control source's default view, which the operator can change, with live link bandwidth. It is not a ROS node: rosbridge publishes and calls for it."
calls = ["/robot/request_mode"]
subscribes = ["/robot/mode", "/power/battery", "/mechanism/status", "camera-image", "obstacle-map", "planned-path"]

[[node.publishes]]
name = "/joy"
type = "sensor_msgs/msg/Joy"
rate = "`autorepeat_rate`, 20 Hz, and on change [TBR: teleop draft, PR #14]"
qos = "[TBD: as rosbridge publishes it, teleoperation doc (5.1)]"

[[node.publishes]]
name = "/operator/heartbeat"
type = "std_msgs/msg/Header"
rate = "`heartbeat_rate`, 10 Hz, including in AUTO and with the hold button released"
qos = "best effort, depth 1"

[[node]]
id = "teleop_node"
name = "`teleop_node`"
package = "`luna_teleop` [TBR: teleop draft, PR #14]"
runs_on = "Robot computer"
element = "SW.3.2"
does = "Turns fresh /joy input into drive and mechanism commands, zeroes them when the hold button is released, drops stale input, and requests DISABLED when the controller's input is lost"
subscribes = ["/joy", "/robot/mode"]
calls = ["/robot/request_mode"]

[[node.publishes]]
name = "/teleop/cmd_vel"
type = "geometry_msgs/msg/TwistStamped [TBR: teleop draft, PR #14]"
rate = "`command_rate`, 20 Hz [TBR: teleop draft, PR #14]"
qos = "best effort, volatile, depth 1 [TBR: teleop draft, PR #14]"
note = "The name comes from the teleop draft (PR #14) [TBR: teleop open question 3, which decides how TELEOP and AUTO commands reach the drivetrain]."

[[node.publishes]]
id = "teleop-mechanism-command"
name = "[TBD: teleop's mechanism command topics, teleop open questions 3 and 5]"
type = "[TBD: mechanism doc (4.2)]"
rate = "`command_rate`, 20 Hz [TBR: teleop draft, PR #14, for the mechanism doc (4.2) to confirm]"
qos = "[TBD: teleoperation doc (5.1)]"
note = "Teleop open question 5 proposes one command topic per function that moves on its own: drive, coordinated depth raise and lower, excavator, conveyor, and hatch."

# ----------------------------------------------------------------------------------------
# Open questions, as the teleop draft numbers them (questions 1 and 2 were settled in
# review). Who answers each one, and by when, is in Turgor.
# ----------------------------------------------------------------------------------------

[[question]]
number = 3
status = "open"
text = "What topics and message types carry movement commands, and which code selects TELEOP or AUTO commands?"

[[question]]
number = 4
status = "open"
turgor = ["5.7"]
text = "What final network settings and frontend delivery will be used: HTTPS and secure WebSockets served from the robot computer, or a packaged desktop app?"

[[question]]
number = 5
status = "open"
text = "What command and telemetry interfaces let teleop expose any combination of functions? The draft proposes one command topic per function that moves on its own (drive, coordinated depth raise and lower, excavator, conveyor, hatch) and one telemetry topic per source, not per motor or button."
