# Registry for the technical performance measures (TPMs) and their budgets, which
# scripts/design renders into performance-budgets.md and into each design doc's Budgets
# table. From the PDR software inputs (1.6), parts 1.3 and 1.4. See "Registries" in
# README.md, then run scripts/design render.
#
# Each [[tpm]] is one measurable quantity with one unit. Its [[tpm.row]] entries split it
# across software elements. A row with an amount counts toward the total; when the TPM
# has a limit, the check fails if the counted parts add up to more, and the page shows the
# margin that is left.

[[tpm]]
id = "TPM-1"
measure = "Autonomous cycles completed per run (excavate, travel, dump, travel, with no operator input)"
unit = "cycles per run"
source = "PMP: Excavation/dump cycles; Autonomous capabilities. Guidebook §16.4, §16.5"
threshold = "≥1"
goal = "≥2, starting in the starting zone (full autonomy)"
better = "higher"
threshold_value = 1
goal_value = 2
budget = "Which elements make each task autonomous"
part = "Autonomous task (guidebook)"
elements_header = "Elements responsible"
allocation = "Points"
budget_unit = "points"
notes = [
  "**Link to berm volume:** the number of cycles needed for a 25 L berm is 25 L divided by the liters delivered per trip, which Mechanical sets. So two cycles need at least 12.5 L delivered per trip.",
]

[[tpm.row]]
part = "Excavation (§16.1)"
elements = ["SW.2.4", "SW.1.3", "SW.2.2"]
role = "SW.2.4 decides when to dig and stop; SW.1.3 digs; SW.2.2 confirms the robot is in the excavation zone"
value = "200"

[[tpm.row]]
part = "Travel (§16.3)"
elements = ["SW.2.2", "SW.2.3", "SW.1.2"]
role = "SW.2.2 localizes and maps; SW.2.3 plans and follows; SW.1.2 drives"
value = "500"

[[tpm.row]]
part = "Dump (§16.2)"
elements = ["SW.2.4", "SW.1.3", "SW.2.2"]
role = "SW.2.4 decides; SW.1.3 opens the hatch and runs the conveyor; SW.2.2 confirms the construction zone"
value = "100"

[[tpm.row]]
part = "Full autonomy (§16.5): at least 2 cycles, starting in the starting zone"
elements = ["SW.2.4", "SW.1.3", "SW.2.2", "SW.2.3", "SW.1.2", "SW.1.1", "SW.1.5", "SW.3.1", "SW.4"]
role = "All of the above, plus SW.1.1 (stays enabled), SW.1.5 (passes AUTO commands), SW.3.1 (heartbeat), and SW.4 (link and logging)"
value = "1,400 × berm factor"

[[tpm]]
id = "TPM-2"
measure = "Autonomous cycle time"
unit = "min per cycle"
source = "PMP: Excavation/dump cycles. Guidebook §12 (15-minute runs)"
threshold = "≤7.0 [TBR: proposed in the PDR (1.6)]"
goal = "≤6.0 [TBR: proposed in the PDR (1.6)]"
better = "lower"
threshold_value = 7.0
goal_value = 6.0
budget = "Budget for the 6.0 min (360 s) goal"
part = "Phase"
allocation = "Allocation (s)"
budget_unit = "s"
limit = 360
notes = [
  "**Threshold:** a 15-minute run, minus 1 minute to start (TPM-3 goal), split over 2 cycles, gives 7.0 min. The goal keeps 2 minutes of margin.",
  "**If 2 trips can't reach 25 L,** cycle time must drop to 14 min divided by the number of cycles needed.",
]

[[tpm.row]]
part = "Excavate until the bin is full"
elements = ["SW.1.3", "SW.2.4"]
role = "SW.1.3 runs the excavator; SW.2.4 decides when to stop"
