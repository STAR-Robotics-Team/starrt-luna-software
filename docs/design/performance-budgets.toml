[[tpm]]
id = "TPM-7"
measure = "Stop time after a disable command (request received on the robot, to zero output at every motor controller)"
unit = "ms"
source = "Guidebook §13.9.19 (power-off command), §15.4.1 (stop when time is up)"
threshold = "≤100"
goal = "≤100"
better = "lower"
threshold_value = 100
goal_value = 100
budget = "Delay budget (ms)"
part = "Step"
allocation = "Allocation (ms)"
budget_unit = "ms"
limit = 100
notes = [
  "**If the mode manager itself stops,** the drivetrain and mechanism treat a `/robot/mode` older than `mode_timeout` (0.3 s) as DISABLED, so output is zero within 400 ms (drivetrain draft R3).",
]

[[tpm.row]]
part = "Accept the disable request and publish DISABLED"
elements = ["SW.1.1"]
value = "≤10"
amount = 10

[[tpm.row]]
part = "Receive DISABLED and send zero output on CAN, in the next 50 Hz control loop"
elements = ["SW.1.2", "SW.1.3"]
role = "SW.1.2 and SW.1.3, in parallel"
value = "≤90"
amount = 90

[[tpm.row]]
part = "Backstop if software hangs: the motor controllers disable themselves 100 ms after the enable signal stops"
role = "Motor controllers (Electronic, not Software)"
value = "100, not counted"

[[tpm]]
id = "TPM-8"
measure = "Stop time after link loss (last heartbeat received, to zero output)"
unit = "ms"
source = "Guidebook §13.9.19 (without the link, the robot can't hear the power-off command)"
threshold = "≤600"
goal = "≤600"
better = "lower"
threshold_value = 600
goal_value = 600
budget = "Delay budget (ms)"
part = "Step"
allocation = "Allocation (ms)"
budget_unit = "ms"
limit = 600
notes = [
  "**The link is TCP (rosbridge).** After a Wi-Fi stall, heartbeats and commands can arrive late, in a burst. The mode manager judges each heartbeat by when it arrived (deliverable 1.8), so a burst that arrives after the robot has disabled doesn't enable it again.",
  "**SW.3.2 drops gamepad input older than `input_timeout`** (0.15 s) [TBR: teleoperation doc (5.1)].",
  "**Stale input:** [TBD: how SW.3.2 tells stale input from fresh, since the laptop's and the robot's clocks differ, teleoperation doc (5.1)].",
]

[[tpm.row]]
part = "Send a heartbeat every 100 ms, which sets how soon a loss can be seen"
elements = ["SW.3.1"]
value = "100 (the period), not counted"

[[tpm.row]]
part = "Declare the link lost"
elements = ["SW.1.1"]
value = "500 after the last heartbeat (`link_timeout`) [TBR: operating modes open question 9]"
amount = 500

