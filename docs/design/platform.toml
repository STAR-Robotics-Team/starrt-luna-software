# Registry for the platform design (platform.md, deliverable 2.11, not written yet). See
# "Registries" in README.md, then run scripts/design render.

[[node]]
id = "rosbridge"
name = "`rosbridge_websocket`"
package = "`rosbridge_server`"
runs_on = "Robot computer"
element = "SW.4"
does = "Carries the operator frontend's topics and service calls over one WebSocket connection; what crosses the radio link is set here (PR #14 review, 2026-10-26)"

[[node]]
id = "recorder"
name = "`ros2 bag` recorder"
package = "`rosbag2`"
runs_on = "Robot computer"
element = "SW.4"
does = "Records every run"
