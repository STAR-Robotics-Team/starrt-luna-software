# Registry for the mechanism design (mechanism.md, deliverable 4.2). See "Registries" in
# README.md, then run scripts/design render.
#
# The mechanism runs in its own ros2_control controller manager, apart from the
# drivetrain's. Its nodes are the controllers loaded there: our mechanism controller, the
# stock joint state broadcaster, and the mechanism mode gate of ours (operating modes,
# section 5). The hardware plugin is not a node; section 5 of the doc describes it.

[[node]]
id = "mechanism"
name = "`mechanism_controller`"
package = "`luna_mechanism`, in the mechanism's controller manager"
runs_on = "Robot computer"
element = "SW.1.3"
does = "Takes one stamped command per function, drops a command older than command_timeout, zeroes a function whose commands stop, moves both depth actuators together, and reports the mechanism's state, including whether the excavator is stowed and the hatch is closed"
subscribes = ["mechanism-command"]

[[node.publishes]]
name = "/mechanism/status"
type = "luna_interfaces/msg/MechanismStatus [TBR: proposed in section 3]"
rate = "10 Hz and on change [TBR]"
qos = "reliable, transient local, depth 1"
note = "Transient local, so mode_manager's entry guards and the task sequencer get the latest state as soon as they start."

[[node]]
id = "mechanism_joint_states"
name = "`joint_state_broadcaster` (mechanism)"
package = "`joint_state_broadcaster` (ros2_controllers), in the mechanism's controller manager"
runs_on = "Robot computer"
element = "SW.1.3"
does = "Publishes each mechanism joint's position, where it is measured, for the robot model"

[[node.publishes]]
name = "/mechanism/joint_states"
type = "sensor_msgs/msg/JointState"
rate = "The controller manager's `update_rate`, 50 Hz"
qos = "the system default: reliable, volatile"
note = "Remapped from joint_states, so the drivetrain's and the mechanism's broadcasters each have a topic of their own."

[[node]]
id = "mechanism_mode_gate"
name = "Mechanism mode gate"
package = "`luna_modes` [TBR: 1.17 builds it], in the mechanism's controller manager"
runs_on = "Robot computer"
element = "SW.1.3"
does = "Writes enable and the task mode to the mechanism hardware plugin from /robot/mode, with enable 1 only in EXCAVATE, DUMP, and SERVICE; writes enable 0 when /robot/mode goes stale; and reports the plugin's faults and stalls on /diagnostics"
subscribes = ["/robot/mode"]
publishes_shared = ["/diagnostics"]

# ----------------------------------------------------------------------------------------
# Open questions (section 9). Who answers each one, and by when, is in Turgor. The
# operating modes doc holds the mechanism questions that shape the modes: its questions 2,
# 3, 4, 5, and 10.
# ----------------------------------------------------------------------------------------

[[question]]
number = 1
status = "open"
turgor = ["4.1"]
text = "Do the two depth actuators lift one excavator frame, so that one getting ahead of the other twists it? If so, how far apart may their positions get before the controller stops both (depth_max_mismatch)?"

[[question]]
number = 2
status = "open"
turgor = ["4.3"]
text = "How does software read each depth actuator's potentiometer: through its motor controller's analog input, or another input? It decides whether depth can take position commands on the robot."

[[question]]
number = 3
status = "open"
turgor = ["4.1"]
text = "What tells software the hatch is fully open, and how far does it travel? With a sensor at each end, the hatch can take an open or close command and stop by itself; without one, it runs only while its button is held."

[[question]]
number = 4
status = "open"
turgor = ["4.1"]
text = "Which way is positive for each function, once Mechanical mounts them? Proposed in section 3: positive raises the excavator, runs the chain and the conveyor the way they run while digging, and opens the hatch."
