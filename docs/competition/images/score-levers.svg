<text x="397.9" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">500</text>
<line x1="481.8" y1="56" x2="481.8" y2="354" stroke="#e4e7eb" stroke-width="1"/>
<text x="481.8" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">750</text>
<line x1="565.7" y1="56" x2="565.7" y2="354" stroke="#e4e7eb" stroke-width="1"/>
<text x="565.7" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">1,000</text>
<line x1="649.6" y1="56" x2="649.6" y2="354" stroke="#e4e7eb" stroke-width="1"/>
<text x="649.6" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle">1,250</text>
<text x="218" y="82.0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="end">Run fully autonomously</text>
