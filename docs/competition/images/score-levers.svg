<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 388" width="780" height="388" role="img" aria-labelledby="t d">
<title id="t">Extra points per run from each improvement</title>
<desc id="d">Starting from the guidebook example run of 724 points: running fully autonomously adds 1325 points; automating every cycle adds 925; using 10 Wh less energy adds 83; building 10 litres more berm adds 72; a 10 kg lighter robot adds 62; hitting no obstacles adds 50; turning off the arena camera adds 15.</desc>
