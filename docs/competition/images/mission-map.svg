<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 728" width="808" height="728" role="img" aria-labelledby="t d">
<title id="t">The Lunabotics arena and the mission cycle</title>
<desc id="d">A 6.88 by 5 metre arena seen from above. The excavation zone fills the first 2.5 metres and contains a 2 by 2 metre starting zone in the corner at the origin. The obstacle zone fills the remaining 4.38 metres, with a fixed column, rocks, and craters. The construction zone is in the far corner along the same wall, holding the 2.2 by 0.9 metre berm target centred at X 5.38 m, Y 0.9 m. Arrows show the cycle: excavate, travel loaded through the obstacles, dump on the berm, travel back empty.</desc>
