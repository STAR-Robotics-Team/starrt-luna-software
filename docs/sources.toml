# Every source these docs cite: datasheets, rulebooks, standards, and vendor pages.
#
# Edit this file, then run `scripts/sources render` to rebuild docs/sources.md. A doc cites
# an entry by linking to it on that page, with the page or section in the link text; see
# "Cite sources" in docs/writing-docs.md.
#
# Fields:
#   id         Short, lowercase, hyphenated, and permanent: citations link to it.
#   group      One of the groups listed in scripts/sources.
#   primary    true when it comes from whoever makes the part or sets the rule, such as a
#              datasheet or the guidebook; false for a reseller's page, a retailer's chart,
#              or a document repeating another. Primary sources win when they disagree.
#   title      The source's own title.
#   publisher  Who publishes it.
#   version    The revision or date printed on it, so readers know which edition was read.
#   url        Where to open it. For a PDF, the PDF itself.
#   format     "pdf" or "web".
#   sha256     For a PDF: the fingerprint of the exact file that was read. Get it with
#              `scripts/sources hash <url>`. If the vendor changes the file, the weekly
#              check reports it, and someone rereads the cited pages.
#   fetch      false when the file cannot be downloaded automatically (behind a login).
#   fetch_url  A copy the tools read instead of url, when url turns away automated checks.
#   expect     For a web page: words the page must show. The weekly check uses them to
#              catch a page that moved, changed, or answered with a bot check instead.
#   checked    The date someone last read this source against the docs that cite it.
#   notes      What the team uses it for.
#
# PDFs are linked, never copied into the repository: they are the publishers' copyrighted
# work, and the docs website is public.

