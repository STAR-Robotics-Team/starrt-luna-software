# Checks the docs' sources (docs/sources.toml, scripts/sources). On every pull request
# that touches the docs: every citation points at a registry entry and docs/sources.md is
# up to date. Every Monday: every link still answers and no cited PDF has changed, and,
# once the repository has an ANTHROPIC_API_KEY secret, Claude rereads each cited page.
name: Sources

on:
  pull_request:
    paths: [docs/**, scripts/sources, scripts/sources-requirements.txt, .github/workflows/sources.yml]
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: scripts/sources check

  links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: scripts/sources links

  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::No ANTHROPIC_API_KEY secret is set, so Claude did not reread the cited pages."
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/checkout@v7
      - if: env.ANTHROPIC_API_KEY != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/sources-requirements.txt
      - if: env.ANTHROPIC_API_KEY != ''
        run: pip install -r scripts/sources-requirements.txt
      # The report goes on the run's summary page, so anyone can read the verdicts.
      - if: env.ANTHROPIC_API_KEY != ''
        run: scripts/sources verify --report "$GITHUB_STEP_SUMMARY"
