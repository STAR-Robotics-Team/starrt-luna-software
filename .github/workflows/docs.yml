# Builds the documentation website on every pull request that touches the docs, failing on
# broken links, pages missing from mkdocs.yml, or lists that would look different than on
# GitHub (scripts/docs_hooks.py), and publishes it to GitHub Pages when main changes.
name: Docs

on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, scripts/docs_hooks.py, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, scripts/docs_hooks.py, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Hides a notice about MkDocs 2.0 that does not apply; see mkdocs.yml.
  NO_MKDOCS_2_WARNING: "1"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
