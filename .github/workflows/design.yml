# Checks the design docs' registries (docs/design/*.toml, scripts/design) on every pull
# request that touches the docs: the registries fit together, and every table and page
# generated from them is up to date.
name: Design

on:
  pull_request:
    paths: [docs/**, scripts/design, .github/workflows/design.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: scripts/design check
